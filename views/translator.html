<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LanguageBridge</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='translator.css') }}">
</head>

<body>

<div class="container">

    <h1>🌍 AI Translator</h1>

    <div class="language-section">

        <select id="sourceLang">
            <option value="auto">Detect Language</option>
            <option value="en">English</option>
            <option value="te">Telugu</option>
            <option value="hi">Hindi</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
            <option value="ja">Japanese</option>
            <option value="zh-cn">Chinese</option>
            <option value="ar">Arabic</option>
        </select>

        <button id="swapBtn" onclick="swapLanguages()">
            ⇄
        </button>

        <select id="targetLang">
            <option value="te">Telugu</option>
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
            <option value="ja">Japanese</option>
            <option value="zh-cn">Chinese</option>
            <option value="ar">Arabic</option>
        </select>

    </div>

    <textarea
        id="inputText"
        placeholder="Enter text to translate..."
    ></textarea>

    <div class="counter">
        Characters: <span id="charCount">0</span>
    </div>

    <button class="translate-btn"
            onclick="translateText()">
        Translate
    </button>

    <div id="loading" class="loading">
        Translating...
    </div>

    <h2>Translated Text</h2>

    <textarea
        id="outputText"
        readonly
        placeholder="Translation will appear here..."
    ></textarea>

    <div class="action-buttons">

        <button onclick="copyText()">
            📋 Copy
        </button>

        <button onclick="speakText()">
            🔊 Speak
        </button>

        <button onclick="clearAll()">
            🗑 Clear
        </button>

        <button onclick="toggleDarkMode()">
            🌙 Theme
        </button>

    </div>

    <div class="history-box">
        <h3>Recent Translations</h3>
        <ul id="historyList"></ul>
    </div>
    <div style="text-align:center; margin-top:20px; color:white;">
    Developed by Mandapati Anitha | CodeAlpha AI Internship Project
</div>

</div>

<script src="{{ url_for('static', filename='translator.js') }}"></script>

</body>
</html>
